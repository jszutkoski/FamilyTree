<title>Raízes da Família</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen app. Top bar, tree canvas (pan/zoom) on the left, person panel on the right; on phones the panel is a bottom sheet. */
:root {
  --bg: #eef1ec;
  --surface: #fbfcf9;
  --surface-2: #f3f6f1;
  --ink: #1d2a2f;
  --muted: #5d6a64;
  --line: #c8d1c9;
  --accent: #2c6a4d;
  --accent-ink: #ffffff;
  --accent-soft: #dbe9e0;
  --male: #44689c;
  --female: #a34f77;
  --unknown: #8a948f;
  --danger: #a33a2c;
  --danger-soft: #f6e1dd;
  --edge: #8f9c95;
  --shadow: 0 1px 2px rgba(29, 42, 47, .08), 0 4px 14px rgba(29, 42, 47, .06);
  --lb-bg: rgba(12, 16, 14, .94);
  --lb-ink: #e9eee9;
  --photo-cap: #ffffff;
  --photo-shade: rgba(0, 0, 0, .66);
  --font-display: "Literata", Georgia, "Times New Roman", serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #18201d; --surface-2: #1e2723; --ink: #e3e9e5; --muted: #98a59e;
    --line: #2f3a35; --accent: #72c096; --accent-ink: #0f1a15; --accent-soft: #1f3a2d;
    --male: #86a9dc; --female: #df8fb4; --unknown: #8d9892; --danger: #f08b7b; --danger-soft: #3a211d;
    --edge: #5e6c65; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #18201d; --surface-2: #1e2723; --ink: #e3e9e5; --muted: #98a59e;
  --line: #2f3a35; --accent: #72c096; --accent-ink: #0f1a15; --accent-soft: #1f3a2d;
  --male: #86a9dc; --female: #df8fb4; --unknown: #8d9892; --danger: #f08b7b; --danger-soft: #3a211d;
  --edge: #5e6c65; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr) 380px; }

/* ---------- top bar ---------- */
.bar {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 12px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 5;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 19px; letter-spacing: -.01em; white-space: nowrap; }
.brand .count { font-family: var(--font-data); font-size: 12px; color: var(--muted); white-space: nowrap; }
.search { position: relative; flex: 1; max-width: 360px; margin-left: auto; min-width: 0; }
.search input { width: 100%; box-sizing: border-box; padding: 8px 12px 8px 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); max-height: 320px; overflow: auto; padding: 4px; }
.results button { display: flex; width: 100%; justify-content: space-between; gap: 8px; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.results button:hover, .results button.active { background: var(--accent-soft); }
.results .yrs { font-family: var(--font-data); font-size: 12px; color: var(--muted); white-space: nowrap; }
.results .none { padding: 10px; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; white-space: nowrap; font-weight: 500; }
.btn:hover { border-color: var(--edge); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 9px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); width: 280px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; z-index: 20; }
.menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: 6px; cursor: pointer; }
.menu button:hover { background: var(--surface-2); }
.menu small { display: block; color: var(--muted); font-size: 12px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

/* ---------- stage ---------- */
.stage { position: relative; overflow: hidden; min-width: 0; background:
  radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 1.2px) 0 0 / 22px 22px, var(--bg); }
#tree { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#tree.dragging { cursor: grabbing; }
.card-bg { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.node { cursor: pointer; }
.node:hover .card-bg { stroke: var(--edge); }
.node.selected .card-bg { stroke: var(--accent); stroke-width: 2.5; }
.node.root .card-bg { fill: var(--accent-soft); }
.node .nm { font-family: var(--font-display); font-weight: 600; font-size: 14px; fill: var(--ink); }
.node .sn { font-family: var(--font-body); font-size: 12.5px; fill: var(--ink); }
.node .dt { font-family: var(--font-data); font-size: 11px; fill: var(--muted); }
.node .ini { font-family: var(--font-body); font-weight: 600; font-size: 13px; fill: var(--surface); }
.node .tag { font-family: var(--font-body); font-size: 10px; font-weight: 600; letter-spacing: .06em; fill: var(--accent); }
.av-ring.M { stroke: var(--male); } .av-fill.M { fill: var(--male); }
.av-ring.F { stroke: var(--female); } .av-fill.F { fill: var(--female); }
.av-ring.U { stroke: var(--unknown); } .av-fill.U { fill: var(--unknown); }
.av-ring { fill: none; stroke-width: 2; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.edge.hl { stroke: var(--accent); stroke-width: 2.5; }
.union { fill: var(--edge); }
.union.hl { fill: var(--accent); }

.zoom { position: absolute; left: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 4px; }
.zoom .btn { width: 38px; height: 38px; padding: 0; box-shadow: var(--shadow); font-size: 18px; }
.legend { position: absolute; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

.empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; }
.empty-card { max-width: 420px; text-align: center; display: grid; gap: 14px; justify-items: center; }
.empty-card h2 { margin: 0; font-family: var(--font-display); font-size: 26px; text-wrap: balance; }
.empty-card p { margin: 0; color: var(--muted); font-size: 15px; text-wrap: pretty; }
.empty-card svg { max-width: 100%; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
.notice { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--muted); box-shadow: var(--shadow); max-width: calc(100% - 32px); }

/* ---------- panel ---------- */
.panel { background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; min-width: 0; overscroll-behavior: contain; }
.panel-inner { padding: 20px 20px calc(28px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
.sheet-handle { display: none; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.ph { display: flex; gap: 14px; align-items: center; }
.ph-av { width: 72px; height: 72px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 600; font-size: 22px; color: var(--surface); overflow: hidden; border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--line); }
.ph-av img { width: 100%; height: 100%; object-fit: cover; }
.ph-av.M { background: var(--male); } .ph-av.F { background: var(--female); } .ph-av.U { background: var(--unknown); }
.ph h2 { margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 1.2; text-wrap: balance; }
.kin { display: inline-block; margin-top: 4px; font-size: 12.5px; font-weight: 500; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 99px; }
.facts { display: grid; gap: 10px; margin: 0; }
.fact { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: baseline; }
.fact .sym { font-family: var(--font-data); color: var(--muted); text-align: center; }
.fact dt { font-size: 12px; color: var(--muted); }
.fact dd { margin: 0; }
.fact .date { font-family: var(--font-data); font-size: 13px; }
.notes { white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; margin: 0; }
.section { display: grid; gap: 8px; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chips { display: grid; gap: 6px; }
.chip { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.chip .dot.M { background: var(--male); } .chip .dot.F { background: var(--female); } .chip .dot.U { background: var(--unknown); }
.chip .who { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.chip .who strong { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .who span { font-family: var(--font-data); font-size: 11.5px; color: var(--muted); }
.chip .x { border: 0; background: none; color: var(--muted); cursor: pointer; width: 28px; height: 28px; border-radius: 6px; flex: none; }
.chip .x:hover { background: var(--danger-soft); color: var(--danger); }
.chip .mini { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 4px 6px; border-radius: 6px; white-space: nowrap; }
.chip .mini:hover { background: var(--surface-2); color: var(--ink); }
.empty-rel { color: var(--muted); font-size: 13px; margin: 0; }
.adds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.confirm { background: var(--danger-soft); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
.confirm p { margin: 0; }

.list { display: grid; gap: 2px; }
.list button { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; width: 100%; background: none; border: 0; text-align: left; padding: 8px 8px; border-radius: 6px; cursor: pointer; }
.list button:hover { background: var(--surface-2); }
.list .yrs { font-family: var(--font-data); font-size: 12px; color: var(--muted); white-space: nowrap; }
.list .grp { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 8px 2px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 10px; }
.stat b { display: block; font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; margin: 0; }

/* forms */
form { display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .field .lbl { font-size: 12px; font-weight: 500; color: var(--muted); }
.field input[type=text], .field select, .field textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.field textarea { min-height: 84px; resize: vertical; }
.field .help { font-size: 11.5px; color: var(--muted); }
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px; margin: 0; display: grid; gap: 10px; }
legend { font-size: 12px; font-weight: 600; color: var(--muted); padding: 0 4px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg label { padding: 6px 12px; cursor: pointer; font-size: 13px; border-left: 1px solid var(--line); }
.seg label:first-of-type { border-left: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg input:checked + label { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
.check { display: flex; gap: 8px; align-items: center; }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 9px; }
.tabs button { flex: 1; border: 0; background: none; padding: 7px; border-radius: 7px; cursor: pointer; font-weight: 500; color: var(--muted); }
.tabs button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.photo-row { display: flex; gap: 12px; align-items: center; }
.photo-row .ph-av { width: 56px; height: 56px; font-size: 18px; }
.err { color: var(--danger); font-size: 13px; margin: 0; }
textarea.code { font-family: var(--font-data); font-size: 11px; min-height: 140px; }

/* ---------- phase 2: tabs, timeline, memories, sources, viewer ---------- */
.form-title { margin: 0; font-family: var(--font-display); font-size: 20px; line-height: 1.25; text-wrap: balance; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ptabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.ptabs::-webkit-scrollbar { display: none; }
.ptabs button { flex: 1 0 auto; border: 0; background: none; padding: 9px 4px 10px; font-weight: 500; font-size: 13.5px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.ptabs button:hover { color: var(--ink); }
.ptabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.ptabs i { font-style: normal; font-family: var(--font-data); font-size: 11px; background: var(--surface-2); border-radius: 99px; padding: 1px 6px; margin-left: 2px; }
.tl-title .mini { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 6px; }
.tl-title .mini:hover { background: var(--surface-2); color: var(--ink); }
.cite { font-family: var(--font-data); font-size: 10px; font-weight: 500; color: var(--accent); margin-left: 3px; }
.sym.fs { font-size: 10px; font-weight: 600; letter-spacing: .02em; }
.facts a, .src a, .lb-info a:not(.btn) { color: var(--accent); text-underline-offset: 3px; }
.stat b small { font-size: 13px; color: var(--muted); font-weight: 400; }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.linkish:hover { text-decoration-color: var(--accent); }
.nm-line { display: block; }
.gap-line { display: block; color: var(--muted); font-size: 12px; }
.olist { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.people-links { font-size: 13px; }

.tl { list-style: none; margin: 0; padding: 0; display: grid; }
.tl-item { display: grid; grid-template-columns: 74px 20px minmax(0, 1fr); column-gap: 10px; position: relative; padding-bottom: 16px; }
.tl-item::before { content: ""; position: absolute; left: calc(74px + 10px + 9.5px); top: 20px; bottom: 0; width: 1px; background: var(--line); }
.tl-item:last-child::before { display: none; }
.tl-date { text-align: right; font-family: var(--font-data); padding-top: 1px; }
.tl-date b { display: block; font-weight: 500; font-size: 13px; font-variant-numeric: tabular-nums; }
.tl-date span { display: block; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--font-data); font-size: 11px; position: relative; z-index: 1; }
.tl-item.family .tl-dot { background: var(--surface-2); color: var(--ink); }
.tl-item.context .tl-dot { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
.tl-item.context .tl-title { color: var(--muted); font-weight: 400; }
.tl-body { min-width: 0; }
.tl-title { font-weight: 500; }
.tl-place { font-size: 13px; color: var(--muted); }
.tl-detail { font-size: 13px; white-space: pre-wrap; margin-top: 2px; }
.age { font-family: var(--font-data); font-size: 11px; color: var(--muted); margin-top: 2px; }

.gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.gallery.sm { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.thumb { position: relative; aspect-ratio: 1; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; padding: 0; background: var(--surface-2); cursor: pointer; display: block; width: 100%; max-width: 100%; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 6px 4px; font-size: 11px; color: var(--photo-cap); background: linear-gradient(transparent, var(--photo-shade)); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gallery.sm .thumb .cap { display: none; }
.thumb.pdf .cap { color: var(--ink); background: none; }
.thumb .badge { position: absolute; top: 5px; left: 5px; font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; background: var(--surface); color: var(--ink); border-radius: 4px; padding: 1px 5px; }
.pdf-ico { position: absolute; inset: 0 0 18px; display: grid; place-items: center; font-family: var(--font-data); font-weight: 500; color: var(--danger); font-size: 15px; letter-spacing: .06em; }
.gallery.sm .pdf-ico { inset: 0; font-size: 12px; }
.pdf-ico.big { position: static; font-size: 28px; width: 120px; height: 150px; border-radius: 8px; background: var(--surface); color: var(--danger); }

.srcs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.src { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.src .n { font-family: var(--font-data); color: var(--accent); font-weight: 500; }
.src-body { display: grid; gap: 5px; min-width: 0; }
.src-title { font-weight: 600; }
.src-meta, .src-facts { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
details summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details .notes { margin-top: 6px; }
.cite-existing { display: flex; gap: 6px; align-items: center; }
.cite-existing select { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.checks { display: grid; gap: 6px; }

.lb { position: fixed; inset: 0; z-index: 40; background: var(--lb-bg); display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
.lb-media { display: grid; place-items: center; padding: calc(60px + env(safe-area-inset-top, 0px)) 16px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); min-width: 0; min-height: 0; overflow: hidden; }
.lb-media img { max-width: 100%; max-height: calc(100vh - 100px); object-fit: contain; border-radius: 4px; box-shadow: 0 10px 40px rgba(0, 0, 0, .45); }
.lb-pdf { display: grid; gap: 16px; justify-items: center; }
.lb-top { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); display: flex; gap: 6px; align-items: center; }
.lb-top span { color: var(--lb-ink); font-family: var(--font-data); font-size: 12px; margin-left: 4px; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script>
(() => {
"use strict";

/* ================= state ================= */
const S = {
  people: new Map(),     // id -> person
  families: new Map(),   // id -> { partners:[], children:[], marriageDate, marriagePlace }
  media: new Map(),      // id -> { kind, title, date, place, note, people:[], asset, thumb, mime, sourceId }
  sources: new Map(),    // id -> { type, title, date, repository, reference, url, transcription, people:[], facts:[] }
  personTab: "resumo",
  overviewTab: "pessoas",
  lb: null,
  settings: { rootId: null },
  selected: null,
  view: { mode: "overview" }, // overview | person | edit | family | confirmDelete | export
  canWrite: true,
  loaded: false,
  storeKind: null,
  layout: null,
  t: { x: 0, y: 0, k: 1 },
  fittedOnce: false,
};
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const isPhone = () => window.matchMedia("(max-width: 760px)").matches;

/* ================= storage ================= */
const LS_KEY = "raizes-da-familia-v1";
const Store = {
  kind: null, db: null, assets: null, downloads: null,
  local: { people: {}, families: {}, media: {}, sources: {}, meta: {} },
  async put(col, id, data) {
    if (this.kind === "db") { S[col].set(id, data); return this.db.doc(col + "/" + id).set(data); }
    this.local[col][id] = data; this.saveLocal(); applyLocal();
  },
  async del(col, id) {
    if (this.kind === "db") { S[col].delete(id); return this.db.doc(col + "/" + id).delete(); }
    delete this.local[col][id]; this.saveLocal(); applyLocal();
  },
  saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(this.local)); } catch (e) { toast("O navegador não tem mais espaço para guardar. Use a página publicada."); } },
  loadLocal() {
    try { const raw = localStorage.getItem(LS_KEY); if (raw) this.local = Object.assign({ people: {}, families: {}, media: {}, sources: {}, meta: {} }, JSON.parse(raw)); } catch (e) { /* ignore */ }
  },
};
function applyLocal() {
  S.people = new Map(Object.entries(Store.local.people));
  S.families = new Map(Object.entries(Store.local.families));
  S.media = new Map(Object.entries(Store.local.media || {}));
  S.sources = new Map(Object.entries(Store.local.sources || {}));
  S.settings = Object.assign({ rootId: null }, Store.local.meta.settings || {});
  S.loaded = true; renderAll();
}
const putPerson = (id, p) => Store.put("people", id, p);
const putFamily = (id, f) => Store.put("families", id, f);
const putMedia = (id, m) => Store.put("media", id, m);
const putSource = (id, x) => Store.put("sources", id, x);
const putSettings = (s) => Store.kind === "db" ? Store.db.doc("meta/settings").set(s) : (Store.local.meta.settings = s, Store.saveLocal(), applyLocal());

async function boot() {
  let db = null;
  if (window.claude && typeof window.claude.use === "function") {
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
  }
  if (!db) {
    Store.kind = "local"; Store.loadLocal(); applyLocal();
    showNotice("Modo local: os dados ficam só neste navegador. Baixe uma cópia de segurança de vez em quando.", 0);
    return;
  }
  Store.kind = "db"; Store.db = db;
  window.claude.use("assets").then((a) => { Store.assets = a; renderPanel(); }).catch(() => {});
  window.claude.use("downloads").then((d) => { Store.downloads = d; }).catch(() => {});
  window.claude.use("user").then(async (u) => {
    if (!u) return;
    try { const ok = await u.canEdit(); S.canWrite = !!ok; document.body.classList.toggle("readonly", !ok); renderAll(); } catch (e) { /* keep */ }
  }).catch(() => {});

  const got = { people: false, families: false, media: false, sources: false, meta: false };
  const timer = setTimeout(() => {
    if (!S.loaded) { $("#loading").textContent = "Não consegui carregar os dados ainda. Verifique a conexão; a página tenta de novo sozinha."; }
  }, 10000);
  const ready = () => { if (Object.values(got).every(Boolean)) { clearTimeout(timer); S.loaded = true; renderAll(); } };
  const onErr = (e) => { clearTimeout(timer); showNotice("Os dados pararam de sincronizar (" + (e && e.code || "erro") + "). Recarregue a página.", 0); };
  db.collection("people").onSnapshot((snap) => {
    const m = new Map(); snap.docs.forEach((d) => m.set(d.id, structuredClone(d.data())));
    S.people = m; got.people = true; S.loaded ? renderAll() : ready();
  }, onErr);
  db.collection("families").onSnapshot((snap) => {
    const m = new Map(); snap.docs.forEach((d) => m.set(d.id, structuredClone(d.data())));
    S.families = m; got.families = true; S.loaded ? renderAll() : ready();
  }, onErr);
  for (const col of ["media", "sources"]) {
    db.collection(col).onSnapshot((snap) => {
      const m = new Map(); snap.docs.forEach((d) => m.set(d.id, structuredClone(d.data())));
      S[col] = m; got[col] = true; S.loaded ? renderAll() : ready();
    }, onErr);
  }
  db.doc("meta/settings").onSnapshot((d) => {
    S.settings = Object.assign({ rootId: null }, d.exists ? d.data() : {}); got.meta = true; S.loaded ? renderAll() : ready();
  }, onErr);
}

/* ================= model helpers ================= */
const P = (id) => S.people.get(id);
const fullName = (p) => p ? [p.given, p.surname].filter(Boolean).join(" ") || "Sem nome" : "?";
const yearOf = (s) => { const m = String(s || "").match(/(\d{4})/); return m ? +m[1] : null; };
const sexOf = (p) => (p && (p.sex === "M" || p.sex === "F")) ? p.sex : "U";
const initials = (p) => ((((p.given || "").trim()[0] || "") + ((p.surname || "").trim()[0] || "")).toUpperCase() || "?");
function lifespan(p, long) {
  const b = yearOf(p.birthDate), d = yearOf(p.deathDate);
  const parts = [];
  if (b) parts.push("* " + b);
  if (d) parts.push("† " + d);
  else if (!p.living && !b) parts.push("†");
  if (!parts.length) return p.living ? "vivo(a)" : "";
  return parts.join(long ? "  ·  " : " · ");
}
const famsAsChild = (id) => [...S.families.entries()].filter(([, f]) => (f.children || []).includes(id));
const famsAsPartner = (id) => [...S.families.entries()].filter(([, f]) => (f.partners || []).includes(id));
const parentsOf = (id) => [...new Set(famsAsChild(id).flatMap(([, f]) => f.partners || []))].filter((x) => S.people.has(x));
const childrenOf = (id) => [...new Set(famsAsPartner(id).flatMap(([, f]) => f.children || []))].filter((x) => S.people.has(x));
const partnersOf = (id) => [...new Set(famsAsPartner(id).flatMap(([, f]) => f.partners || []))].filter((x) => x !== id && S.people.has(x));
const siblingsOf = (id) => [...new Set(famsAsChild(id).flatMap(([, f]) => f.children || []))].filter((x) => x !== id && S.people.has(x));
const byBirth = (a, b) => (yearOf(P(a)?.birthDate) ?? 9999) - (yearOf(P(b)?.birthDate) ?? 9999);
const photoSrc = (p) => !p.photo ? null : (p.photo.startsWith("data:") ? p.photo : "/_blob/" + p.photo);
/* ---- dates ---- */
function dateKey(s) {
  s = String(s || "").trim(); if (!s) return null;
  let m = s.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/);
  if (m) return +m[3] * 10000 + +m[2] * 100 + +m[1];
  m = s.match(/(\d{1,2})[\/.\-](\d{4})/);
  if (m) return +m[2] * 10000 + +m[1] * 100;
  m = s.match(/(\d{4})/);
  if (!m) return null;
  let k = +m[1] * 10000;
  if (/antes|before/i.test(s)) k -= 1; else if (/depois|após|apos|after/i.test(s)) k += 1300;
  return k;
}
const isApprox = (s) => /c\.|cerca|aprox|antes|depois|após|~|\?/i.test(String(s || ""));
function ageAt(p, dateStr) {
  const b = dateKey(p.birthDate), e = dateKey(dateStr);
  if (b == null || e == null || e < b) return null;
  const bmd = b % 10000, emd = e % 10000;
  let age = Math.floor(e / 10000) - Math.floor(b / 10000);
  const precise = bmd >= 100 && emd >= 100 && bmd < 1300 && emd < 1300;
  if (precise && emd < bmd) age--;
  return { age: Math.max(0, age), approx: !precise || isApprox(p.birthDate) || isApprox(dateStr) };
}
function ageLabel(a) {
  if (!a) return "";
  if (a.age === 0) return a.approx ? "no primeiro ano de vida (aprox.)" : "com menos de 1 ano";
  return `${a.approx ? "por volta dos" : "aos"} ${a.age} ${a.age === 1 ? "ano" : "anos"}`;
}

/* ---- memories, sources, events ---- */
const EVENT_TYPES = {
  baptism: "Batismo", firstCommunion: "Primeira comunhão", confirmation: "Crisma", education: "Formatura",
  residence: "Mudança de residência", emigration: "Emigração", immigration: "Imigração", naturalization: "Naturalização",
  military: "Serviço militar", work: "Trabalho", retirement: "Aposentadoria", burial: "Sepultamento", other: "Outro evento",
};
const SOURCE_TYPES = {
  birthCert: "Certidão de nascimento", marriageCert: "Certidão de casamento", deathCert: "Certidão de óbito",
  baptism: "Registro de batismo", parish: "Outro registro paroquial", immigration: "Registro de imigração",
  census: "Censo ou recenseamento", idDoc: "Documento pessoal", familysearch: "Registro no FamilySearch",
  newspaper: "Jornal ou publicação", oral: "Relato de família", photo: "Fotografia", other: "Outra fonte",
};
const evTitle = (ev) => ev.title || EVENT_TYPES[ev.type] || "Evento";
const assetUrl = (a) => !a ? null : (a.startsWith("data:") ? a : "/_blob/" + a);
const isPdfMedia = (m) => m.mime === "application/pdf";
const byDateThenCreated = (a, b) => (dateKey(a[1].date) ?? 99999999) - (dateKey(b[1].date) ?? 99999999) || (a[1].created || 0) - (b[1].created || 0);
const mediaOf = (pid) => [...S.media.entries()].filter(([, m]) => (m.people || []).includes(pid)).sort(byDateThenCreated);
const sourcesOf = (pid) => [...S.sources.entries()].filter(([, s]) => (s.people || []).includes(pid)).sort((a, b) => (a[1].created || 0) - (b[1].created || 0));
const sourceTitle = (s) => s.title || SOURCE_TYPES[s.type] || "Fonte";
function citeNums(pid, key) {
  const out = [];
  sourcesOf(pid).forEach(([, s], i) => { if ((s.facts || []).includes(key)) out.push(i + 1); });
  return out;
}
function cite(pid, key) {
  const n = citeNums(pid, key);
  return n.length ? `<sup class="cite" title="Fonte ${n.join(", ")}">${n.join(",")}</sup>` : "";
}
function factCatalog(pid) {
  const p = P(pid), out = [];
  out.push({ key: pid + ":birth", label: "Nascimento" });
  out.push({ key: pid + ":parents", label: "Filiação (quem são os pais)" });
  if (!p.living) out.push({ key: pid + ":death", label: "Falecimento" });
  for (const ev of p.events || []) out.push({ key: pid + ":ev:" + ev.id, label: evTitle(ev) + (ev.date ? ` (${ev.date})` : "") });
  for (const [fid, f] of famsAsPartner(pid)) {
    const o = f.partners.find((x) => x !== pid);
    if (o && S.people.has(o)) out.push({ key: "fam:" + fid + ":marriage", label: "União com " + fullName(P(o)) });
  }
  return out;
}
function assetInUse(a, ex = {}) {
  if (!a) return false;
  for (const [pid, p] of S.people) if (pid !== ex.person && p.photo === a) return true;
  for (const [mid, m] of S.media) if (mid !== ex.media && (m.asset === a || m.thumb === a)) return true;
  return false;
}
function dropAsset(a, ex) { if (a && !a.startsWith("data:") && Store.assets && !assetInUse(a, ex)) Store.assets.delete(a).catch(() => {}); }
const safeUrl = (u) => /^https?:\/\//i.test(String(u || "").trim()) ? String(u).trim() : "";
const FS_RE = /^[A-Z0-9]{4}-[A-Z0-9]{3,4}$/;


/* ---- kinship relative to "me" (Portuguese terms) ---- */
function ancestorsWithGen(id) {
  const out = new Map([[id, 0]]); const q = [id];
  while (q.length) { const x = q.shift(); for (const p of parentsOf(x)) if (!out.has(p)) { out.set(p, out.get(x) + 1); q.push(p); } }
  return out;
}
function bloodLink(a, b) {
  const A = ancestorsWithGen(a), B = ancestorsWithGen(b);
  let best = null;
  for (const [x, ga] of A) if (B.has(x)) { const s = ga + B.get(x); if (!best || s < best.s) best = { up: ga, down: B.get(x), s }; }
  return best;
}
function kinName(up, down, sex) {
  const g = (m, f, u) => sex === "M" ? m : sex === "F" ? f : u;
  const deg = (n) => n + "º";
  if (up === 0 && down === 0) return "Você";
  if (up === 0) return [null, g("Filho", "Filha", "Filho(a)"), g("Neto", "Neta", "Neto(a)"), g("Bisneto", "Bisneta", "Bisneto(a)"), g("Trineto", "Trineta", "Trineto(a)"), g("Tetraneto", "Tetraneta", "Tetraneto(a)")][down] || `Descendente (${down}ª geração)`;
  if (down === 0) return [null, g("Pai", "Mãe", "Pai/Mãe"), g("Avô", "Avó", "Avô/Avó"), g("Bisavô", "Bisavó", "Bisavô/Bisavó"), g("Trisavô", "Trisavó", "Trisavô/Trisavó"), g("Tetravô", "Tetravó", "Tetravô/Tetravó")][up] || `Ancestral (${up} gerações acima)`;
  if (up === 1 && down === 1) return g("Irmão", "Irmã", "Irmão/Irmã");
  if (down === 1) return [null, null, g("Tio", "Tia", "Tio(a)"), g("Tio-avô", "Tia-avó", "Tio(a)-avô(ó)"), g("Tio-bisavô", "Tia-bisavó", "Tio(a)-bisavô(ó)")][up] || "Parente colateral";
  if (up === 1) return [null, null, g("Sobrinho", "Sobrinha", "Sobrinho(a)"), g("Sobrinho-neto", "Sobrinha-neta", "Sobrinho(a)-neto(a)"), g("Sobrinho-bisneto", "Sobrinha-bisneta", "Sobrinho(a)-bisneto(a)")][down] || "Parente colateral";
  const cousin = g("Primo", "Prima", "Primo(a)");
  const n = Math.min(up, down) - 1;
  const base = n === 1 ? cousin : `${cousin} de ${deg(n)} grau`;
  if (up === down) return base;
  const diff = Math.abs(up - down);
  return `${base}, ${diff} ${diff === 1 ? "geração" : "gerações"} ${down > up ? "abaixo" : "acima"}`;
}
function kinship(rootId, id) {
  if (!rootId || !S.people.has(rootId) || !S.people.has(id)) return null;
  const sex = sexOf(P(id));
  const g = (m, f, u) => sex === "M" ? m : sex === "F" ? f : u;
  if (rootId === id) return "Você";
  const bl = bloodLink(rootId, id);
  if (bl) return kinName(bl.up, bl.down, sex);
  if (partnersOf(rootId).includes(id)) return g("Marido", "Esposa", "Cônjuge");
  for (const sp of partnersOf(rootId)) {
    const l = bloodLink(sp, id);
    if (!l) continue;
    if (l.up === 1 && l.down === 0) return g("Sogro", "Sogra", "Sogro(a)");
    if (l.up === 1 && l.down === 1) return g("Cunhado", "Cunhada", "Cunhado(a)");
    if (l.up === 0 && l.down === 1) return g("Enteado", "Enteada", "Enteado(a)");
    return kinName(l.up, l.down, sex).toLowerCase() + " do cônjuge";
  }
  for (const sp of partnersOf(id)) {
    const l = bloodLink(rootId, sp);
    if (!l) continue;
    if (l.up === 0 && l.down === 1) return g("Genro", "Nora", "Genro/Nora");
    if (l.up === 1 && l.down === 1) return g("Cunhado", "Cunhada", "Cunhado(a)");
    if (l.up === 1 && l.down === 0) return g("Padrasto", "Madrasta", "Padrasto/Madrasta");
    return `Cônjuge de ${kinName(l.up, l.down, sexOf(P(sp))).toLowerCase()}`;
  }
  return null;
}

/* ================= relationship edits ================= */
async function saveFamOrDrop(fid, f) {
  const partners = (f.partners || []).filter((x) => S.people.has(x));
  const children = (f.children || []).filter((x) => S.people.has(x));
  const keep = (partners.length >= 2) || (partners.length === 1 && children.length >= 1) || (partners.length === 0 && children.length >= 2);
  if (keep) await putFamily(fid, { ...f, partners, children });
  else if (S.families.has(fid)) await Store.del("families", fid);
}
function soloFamily(pid) { return famsAsPartner(pid).find(([, f]) => f.partners.length === 1); }
function coupleFamily(a, b) { return famsAsPartner(a).find(([, f]) => f.partners.includes(b)); }

async function addParent(childId, parentId) {
  if (childId === parentId) throw new Error("Uma pessoa não pode ser pai ou mãe de si mesma.");
  if (ancestorsWithGen(parentId).has(childId)) throw new Error("Essa ligação criaria um ciclo na árvore.");
  const asChild = famsAsChild(childId);
  if (asChild.some(([, f]) => f.partners.includes(parentId))) return;
  const [fid, f] = asChild[0] || [];
  if (f) {
    if (f.partners.length >= 2) throw new Error(`${fullName(P(childId))} já tem pai e mãe cadastrados.`);
    if (f.partners.length === 1) {
      const couple = coupleFamily(f.partners[0], parentId);
      if (couple) {
        await saveFamOrDrop(fid, { ...f, children: f.children.filter((c) => c !== childId) });
        await putFamily(couple[0], { ...couple[1], children: [...couple[1].children, childId] });
        return;
      }
    }
    await putFamily(fid, { ...f, partners: [...f.partners, parentId] });
    return;
  }
  const solo = soloFamily(parentId);
  if (solo) await putFamily(solo[0], { ...solo[1], children: [...solo[1].children, childId] });
  else await putFamily(uid("f"), { partners: [parentId], children: [childId], marriageDate: "", marriagePlace: "" });
}
async function addPartner(a, b) {
  if (a === b) throw new Error("Escolha outra pessoa.");
  if (coupleFamily(a, b)) return;
  const sa = soloFamily(a), sb = soloFamily(b);
  if (sa) {
    const children = [...sa[1].children];
    if (sb) { children.push(...sb[1].children.filter((c) => !children.includes(c))); await Store.del("families", sb[0]); }
    await putFamily(sa[0], { ...sa[1], partners: [a, b], children });
  } else if (sb) {
    await putFamily(sb[0], { ...sb[1], partners: [b, a] });
  } else {
    await putFamily(uid("f"), { partners: [a, b], children: [], marriageDate: "", marriagePlace: "" });
  }
}
async function addChild(parentId, childId, famChoice) {
  if (childId === parentId) throw new Error("Escolha outra pessoa.");
  if (ancestorsWithGen(parentId).has(childId)) throw new Error("Essa ligação criaria um ciclo na árvore.");
  if (famChoice && S.families.has(famChoice)) {
    const f = S.families.get(famChoice);
    if (f.children.includes(childId)) return;
    if (famsAsChild(childId).length) throw new Error(`${fullName(P(childId))} já está ligado(a) a outros pais. Remova essa ligação antes.`);
    await putFamily(famChoice, { ...f, children: [...f.children, childId] });
    return;
  }
  await addParent(childId, parentId);
}
async function addSibling(personId, sibId) {
  if (personId === sibId) throw new Error("Escolha outra pessoa.");
  const fam = famsAsChild(personId)[0];
  if (famsAsChild(sibId).length && !(fam && fam[1].children.includes(sibId))) throw new Error(`${fullName(P(sibId))} já está ligado(a) a outros pais.`);
  if (fam) { if (!fam[1].children.includes(sibId)) await putFamily(fam[0], { ...fam[1], children: [...fam[1].children, sibId] }); }
  else await putFamily(uid("f"), { partners: [], children: [personId, sibId], marriageDate: "", marriagePlace: "" });
}
async function unlinkParent(childId, parentId) {
  for (const [fid, f] of famsAsChild(childId)) if (f.partners.includes(parentId)) {
    if (f.children.length === 1) await saveFamOrDrop(fid, { ...f, partners: f.partners.filter((x) => x !== parentId) });
    else {
      await putFamily(fid, { ...f, children: f.children.filter((c) => c !== childId) });
      const others = f.partners.filter((x) => x !== parentId);
      if (others.length) await putFamily(uid("f"), { partners: others, children: [childId], marriageDate: "", marriagePlace: "" });
    }
  }
}
async function unlinkChild(parentId, childId) { return unlinkParent(childId, parentId); }
async function unlinkPartner(a, b) {
  const c = coupleFamily(a, b); if (!c) return;
  const [fid, f] = c;
  if (f.children.length) throw new Error("Esse casal tem filhos cadastrados. Remova os filhos do casal antes de desfazer a união.");
  await Store.del("families", fid);
}
async function unlinkSibling(a, b) {
  for (const [fid, f] of famsAsChild(a)) if (f.children.includes(b)) {
    if (f.partners.length) throw new Error("Irmãos são ligados pelos pais. Para separar, remova o pai ou a mãe de um deles.");
    await saveFamOrDrop(fid, { ...f, children: f.children.filter((c) => c !== b) });
  }
}
async function deletePerson(id) {
  for (const [fid, f] of [...S.families.entries()]) {
    if (f.partners.includes(id) || f.children.includes(id)) {
      const nf = { ...f, partners: f.partners.filter((x) => x !== id), children: f.children.filter((x) => x !== id) };
      const partners = nf.partners, children = nf.children;
      const keep = (partners.length >= 2) || (partners.length === 1 && children.length >= 1) || (partners.length === 0 && children.length >= 2);
      if (keep) await putFamily(fid, nf); else await Store.del("families", fid);
    }
  }
  for (const [mid, m] of [...S.media.entries()]) if ((m.people || []).includes(id)) {
    const people = m.people.filter((x) => x !== id);
    if (people.length) await putMedia(mid, { ...m, people });
    else { await Store.del("media", mid); dropAsset(m.asset, { media: mid, person: id }); dropAsset(m.thumb, { media: mid, person: id }); }
  }
  for (const [sid, s] of [...S.sources.entries()]) if ((s.people || []).includes(id)) {
    const people = s.people.filter((x) => x !== id);
    const facts = (s.facts || []).filter((k) => !k.startsWith(id + ":"));
    if (people.length) await putSource(sid, { ...s, people, facts }); else await Store.del("sources", sid);
  }
  const p = P(id);
  await Store.del("people", id);
  if (S.settings.rootId === id) await putSettings({ ...S.settings, rootId: null });
  if (p && p.photo) dropAsset(p.photo, { person: id });
}

/* ================= layout ================= */
const W = 196, H = 64, UNION = 8;
function computeLayout() {
  if (!S.people.size || typeof dagre === "undefined") return null;
  const g = new dagre.graphlib.Graph();
  g.setGraph({ rankdir: "TB", nodesep: 26, ranksep: 34, marginx: 40, marginy: 40 });
  g.setDefaultEdgeLabel(() => ({}));
  for (const id of S.people.keys()) g.setNode(id, { width: W, height: H });
  const fams = [];
  for (const [fid, f] of S.families) {
    const partners = (f.partners || []).filter((x) => S.people.has(x));
    const children = (f.children || []).filter((x) => S.people.has(x)).sort(byBirth);
    if (partners.length + children.length < 2) continue;
    const n = "f:" + fid; g.setNode(n, { width: UNION, height: UNION });
    partners.forEach((p) => g.setEdge(p, n, { weight: 3, minlen: 1 }));
    children.forEach((c) => g.setEdge(n, c, { weight: 1, minlen: 1 }));
    fams.push({ fid, n, partners, children });
  }
  dagre.layout(g);
  const nodes = new Map();
  for (const id of S.people.keys()) { const n = g.node(id); nodes.set(id, { x: n.x, y: n.y }); }
  const unions = fams.map((f) => { const n = g.node(f.n); return { ...f, x: n.x, y: n.y }; });
  const gr = g.graph();
  return { nodes, unions, width: gr.width || 400, height: gr.height || 300 };
}

/* ================= render: tree ================= */
const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const trunc = (s, n) => s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;

function lineagePath(id) {
  // ancestors and descendants of the selected person, to highlight their direct line
  const set = new Set([id]);
  const up = [id]; while (up.length) { const x = up.pop(); for (const p of parentsOf(x)) if (!set.has(p)) { set.add(p); up.push(p); } }
  const dn = [id]; const seen = new Set([id]); while (dn.length) { const x = dn.pop(); for (const c of childrenOf(x)) if (!seen.has(c)) { seen.add(c); set.add(c); dn.push(c); } }
  return set;
}

function renderTree() {
  const edgesG = $("#edges"), nodesG = $("#nodes");
  edgesG.replaceChildren(); nodesG.replaceChildren();
  const L = S.layout = computeLayout();
  if (!L) return;
  const line = S.selected && S.people.has(S.selected) ? lineagePath(S.selected) : null;

  for (const u of L.unions) {
    const famHl = line && u.children.some((c) => line.has(c)) && u.partners.some((p) => line.has(p));
    for (const p of u.partners) {
      const n = L.nodes.get(p);
      const hl = famHl && line.has(p);
      svgEl("path", { class: "edge" + (hl ? " hl" : ""), d: `M${n.x},${n.y + H / 2} V${u.y} H${u.x}` }, edgesG);
    }
    for (const c of u.children) {
      const n = L.nodes.get(c);
      const mid = u.y + (n.y - H / 2 - u.y) / 2;
      const hl = famHl && line.has(c);
      svgEl("path", { class: "edge" + (hl ? " hl" : ""), d: `M${u.x},${u.y} V${mid} H${n.x} V${n.y - H / 2}` }, edgesG);
    }
    svgEl("circle", { class: "union" + (famHl ? " hl" : ""), cx: u.x, cy: u.y, r: 4.5 }, edgesG);
  }

  for (const [id, pos] of L.nodes) {
    const p = P(id), sx = sexOf(p);
    const g = svgEl("g", { class: "node" + (id === S.selected ? " selected" : "") + (id === S.settings.rootId ? " root" : ""), transform: `translate(${pos.x - W / 2},${pos.y - H / 2})`, "data-id": id, tabindex: "0", role: "button", "aria-label": fullName(p) }, nodesG);
    svgEl("rect", { class: "card-bg", width: W, height: H, rx: 10 }, g);
    const cx = 30, cy = H / 2, r = 19;
    const src = photoSrc(p);
    if (src) {
      svgEl("image", { href: src, x: cx - r, y: cy - r, width: r * 2, height: r * 2, "clip-path": "url(#avclip)", preserveAspectRatio: "xMidYMid slice" }, g);
    } else {
      svgEl("circle", { class: "av-fill " + sx, cx, cy, r }, g);
      const t = svgEl("text", { class: "ini", x: cx, y: cy + 4.5, "text-anchor": "middle" }, g);
      t.textContent = initials(p);
    }
    svgEl("circle", { class: "av-ring " + sx, cx, cy, r: r + 2.5 }, g);
    const x0 = 58;
    const given = svgEl("text", { class: "nm", x: x0, y: 22 }, g); given.textContent = trunc(p.given || "Sem nome", 19);
    const sn = svgEl("text", { class: "sn", x: x0, y: 38 }, g); sn.textContent = trunc(p.surname || "", 22);
    const dt = svgEl("text", { class: "dt", x: x0, y: 54 }, g); dt.textContent = lifespan(p);
    if (id === S.settings.rootId) { const tg = svgEl("text", { class: "tag", x: W - 10, y: 15, "text-anchor": "end" }, g); tg.textContent = "VOCÊ"; }
  }
  applyTransform();
  if (!S.fittedOnce) { S.fittedOnce = true; requestAnimationFrame(() => S.settings.rootId && S.people.has(S.settings.rootId) ? centerOn(S.settings.rootId, 1) : fit()); }
}

/* ---- pan & zoom ---- */
const svg = $("#tree"), vp = $("#viewport");
function applyTransform() { vp.setAttribute("transform", `translate(${S.t.x},${S.t.y}) scale(${S.t.k})`); }
function fit() {
  const L = S.layout; if (!L) return;
  const r = svg.getBoundingClientRect();
  const padBottom = isPhone() ? 70 : 0;
  const k = Math.min(1.1, Math.max(0.2, Math.min(r.width / L.width, (r.height - padBottom) / L.height)));
  S.t = { k, x: (r.width - L.width * k) / 2, y: Math.max(0, (r.height - padBottom - L.height * k) / 2) };
  applyTransform();
}
function centerOn(id, k) {
  const L = S.layout; if (!L || !L.nodes.has(id)) return;
  const n = L.nodes.get(id), r = svg.getBoundingClientRect();
  const kk = k || Math.max(S.t.k, 0.8);
  const visibleH = isPhone() && $("#panel").classList.contains("open") ? r.height * 0.35 : (isPhone() ? r.height - 70 : r.height);
  S.t = { k: kk, x: r.width / 2 - n.x * kk, y: visibleH / 2 - n.y * kk };
  applyTransform();
}
function zoomAt(f, cx, cy) {
  const k = Math.min(2.5, Math.max(0.15, S.t.k * f));
  const ratio = k / S.t.k;
  S.t = { k, x: cx - (cx - S.t.x) * ratio, y: cy - (cy - S.t.y) * ratio };
  applyTransform();
}
svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const cx = e.clientX - r.left, cy = e.clientY - r.top;
  if (e.ctrlKey) return zoomAt(Math.exp(-e.deltaY * 0.01), cx, cy);           // trackpad pinch
  const trackpad = e.deltaMode === 0 && (Math.abs(e.deltaX) > 0 || !Number.isInteger(e.deltaY));
  if (trackpad) { S.t.x -= e.deltaX; S.t.y -= e.deltaY; applyTransform(); }  // two-finger scroll pans
  else zoomAt(Math.exp(-e.deltaY * 0.0015 * (e.deltaMode ? 33 : 1)), cx, cy); // mouse wheel zooms
}, { passive: false });
const ptrs = new Map(); let drag = null, pinch = null;
svg.addEventListener("pointerdown", (e) => {
  svg.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, tx: S.t.x, ty: S.t.y, moved: false, target: e.target.closest(".node") };
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: S.t.k }; drag = null;
  }
});
svg.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const r = svg.getBoundingClientRect();
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((pinch.k * d / pinch.d) / S.t.k, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; svg.classList.add("dragging"); }
  if (drag.moved) { S.t.x = drag.tx + dx; S.t.y = drag.ty + dy; applyTransform(); }
});
const endPtr = (e) => {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (drag && ptrs.size === 0) {
    if (!drag.moved) {
      if (drag.target) select(drag.target.dataset.id);
      else if (S.selected) select(null);
    }
    drag = null; svg.classList.remove("dragging");
  }
};
svg.addEventListener("pointerup", endPtr);
svg.addEventListener("pointercancel", endPtr);
svg.addEventListener("keydown", (e) => {
  const n = e.target.closest && e.target.closest(".node");
  if (n && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(n.dataset.id); }
});
$("#zoomCtl").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const r = svg.getBoundingClientRect();
  if (b.dataset.z === "in") zoomAt(1.25, r.width / 2, r.height / 2);
  if (b.dataset.z === "out") zoomAt(0.8, r.width / 2, r.height / 2);
  if (b.dataset.z === "fit") fit();
});
window.addEventListener("resize", () => { if (S.layout && !S.selected) fit(); });

/* ================= selection & panel ================= */
function select(id, opts = {}) {
  S.selected = id && S.people.has(id) ? id : null;
  S.view = S.selected ? { mode: "person" } : { mode: "overview" };
  renderTree(); renderPanel(); $("#panel").scrollTop = 0;
  if (S.selected) { setSheet(true); if (opts.center) centerOn(S.selected); }
  else setSheet(false);
}
function setSheet(open) { $("#panel").classList.toggle("open", !!open); }
$("#handle").addEventListener("click", () => setSheet(!$("#panel").classList.contains("open")));

function personChip(id, opts = {}) {
  const p = P(id); if (!p) return "";
  const extra = opts.extra || "";
  const x = opts.unlink && S.canWrite ? `<button class="x" type="button" data-unlink="${opts.unlink}" data-other="${id}" title="Remover esta ligação" aria-label="Remover ligação com ${esc(fullName(p))}">✕</button>` : "";
  return `<div class="chip"><span class="dot ${sexOf(p)}"></span><button class="who" type="button" data-go="${id}"><strong>${esc(fullName(p))}</strong><span>${esc(lifespan(p) || " ")}</span></button>${extra}${x}</div>`;
}
function relSection(title, ids, unlinkKind, emptyText, mapExtra) {
  return `<div class="section"><p class="eyebrow">${title}</p>${ids.length ? `<div class="chips">${ids.map((id) => personChip(id, { unlink: unlinkKind, extra: mapExtra ? mapExtra(id) : "" })).join("")}</div>` : `<p class="empty-rel">${emptyText}</p>`}</div>`;
}
function avatarHTML(p, cls = "ph-av") {
  const src = photoSrc(p);
  return `<div class="${cls} ${sexOf(p)}">${src ? `<img src="${esc(src)}" alt="">` : esc(initials(p))}</div>`;
}

function renderPanel() {
  const el = $("#panelInner");
  const v = S.view;
  $("#handleText").textContent = S.selected ? fullName(P(S.selected)) : `${S.people.size} ${S.people.size === 1 ? "pessoa" : "pessoas"}`;
  if (!S.loaded) { el.innerHTML = `<p class="hint">Carregando…</p>`; return; }
  if (v.mode === "edit") return renderForm(el);
  if (v.mode === "family") return renderFamilyForm(el);
  if (v.mode === "event") return renderEventForm(el);
  if (v.mode === "source") return renderSourceForm(el);
  if (v.mode === "export") return renderExportBox(el);
  if (v.mode === "restore") return renderRestore(el);
  if (S.selected && S.people.has(S.selected)) return renderPerson(el);
  renderOverview(el);
}

/* ---- overview ---- */
function researchItems() {
  const root = S.settings.rootId && S.people.has(S.settings.rootId) ? S.settings.rootId : null;
  const anc = root ? ancestorsWithGen(root) : new Map();
  const rows = [];
  for (const [id, p] of S.people) {
    const gaps = [];
    if (!p.birthDate) gaps.push("data de nascimento");
    else if (!citeNums(id, id + ":birth").length) gaps.push("fonte do nascimento");
    if (!p.living && !p.deathDate) gaps.push("data de falecimento");
    if (!parentsOf(id).length) gaps.push("pais");
    if (gaps.length) rows.push({ id, gaps, rank: anc.has(id) ? anc.get(id) : 100 });
  }
  rows.sort((a, b) => a.rank - b.rank || fullName(P(a.id)).localeCompare(fullName(P(b.id)), "pt-BR"));
  return rows;
}
function factStats() {
  const cited = new Set([...S.sources.values()].flatMap((s) => s.facts || []));
  let total = 0, ok = 0;
  const count = (k) => { total++; if (cited.has(k)) ok++; };
  for (const [id, p] of S.people) {
    if (p.birthDate || p.birthPlace) count(id + ":birth");
    if (p.deathDate || p.deathPlace) count(id + ":death");
    (p.events || []).forEach((ev) => count(id + ":ev:" + ev.id));
  }
  for (const [fid, f] of S.families) if (f.marriageDate || f.marriagePlace) count("fam:" + fid + ":marriage");
  return { total, ok };
}

function buildTimeline(pid) {
  const p = P(pid), items = [];
  const add = (o) => items.push(o);
  const bk = dateKey(p.birthDate), dk = dateKey(p.deathDate);
  const word = (x, m, f, u) => sexOf(P(x)) === "M" ? m : sexOf(P(x)) === "F" ? f : u;
  if (p.birthDate || p.birthPlace) add({ date: p.birthDate, title: "Nascimento", place: p.birthPlace, key: pid + ":birth", kind: "own", sym: "*", noAge: true });
  for (const ev of p.events || []) add({ date: ev.date, title: evTitle(ev), sub: ev.title ? EVENT_TYPES[ev.type] : "", place: ev.place, detail: ev.note, key: pid + ":ev:" + ev.id, kind: "own", sym: "•", ev: ev.id });
  for (const [fid, f] of famsAsPartner(pid)) {
    const o = f.partners.find((x) => x !== pid);
    if (o && S.people.has(o) && (f.marriageDate || f.marriagePlace)) add({ date: f.marriageDate, title: `União com ${fullName(P(o))}`, place: f.marriagePlace, key: "fam:" + fid + ":marriage", kind: "own", sym: "⚭", go: o });
  }
  for (const c of childrenOf(pid)) {
    const cp = P(c);
    if (cp.birthDate) add({ date: cp.birthDate, title: `Nasce ${word(c, "o filho", "a filha", "o filho(a)")} ${fullName(cp)}`, place: cp.birthPlace, kind: "family", sym: "*", go: c });
  }
  const inLife = (k) => k != null && (bk == null || k >= bk) && (dk == null || k <= dk);
  for (const par of parentsOf(pid)) {
    const pp = P(par), k = dateKey(pp.deathDate);
    if (inLife(k)) add({ date: pp.deathDate, title: `Morre ${word(par, "o pai", "a mãe", "o pai ou mãe")}, ${fullName(pp)}`, kind: "context", sym: "†", go: par });
  }
  for (const sp of partnersOf(pid)) {
    const s = P(sp), k = dateKey(s.deathDate);
    if (inLife(k)) add({ date: s.deathDate, title: `Morre ${word(sp, "o marido", "a esposa", "o cônjuge")}, ${fullName(s)}`, kind: "context", sym: "†", go: sp });
  }
  if (p.deathDate || p.deathPlace) add({ date: p.deathDate, title: "Falecimento", place: p.deathPlace, key: pid + ":death", kind: "own", sym: "†" });
  items.forEach((it, i) => { it.k = dateKey(it.date); it.i = i; });
  return {
    dated: items.filter((i) => i.k != null).sort((a, b) => a.k - b.k || a.i - b.i),
    undated: items.filter((i) => i.k == null),
  };
}

async function submitPerson() {
  const v = S.view;
  const given = $("#f-given").value.trim(), surname = $("#f-surname").value.trim();
  if (!given && !surname) return formErr("Escreva pelo menos o nome ou o sobrenome.");
  const fsv = $("#f-fs").value.trim().toUpperCase();
  if (fsv && !FS_RE.test(fsv)) return formErr("O código do FamilySearch tem o formato XXXX-XXX, por exemplo LZ8K-QW2.");
  const living = $("#f-living").checked;
  const prev = v.id ? P(v.id) : {};
  const data = {
    ...prev,
    given, surname,
    sex: (document.querySelector("input[name=sex]:checked") || {}).value || "U",
    living,
    birthDate: $("#f-bd").value.trim(), birthPlace: $("#f-bp").value.trim(),
    deathDate: living ? "" : $("#f-dd").value.trim(), deathPlace: living ? "" : $("#f-dp").value.trim(),
    occupation: $("#f-occ").value.trim(), notes: $("#f-notes").value.trim(),
    fsid: $("#f-fs").value.trim().toUpperCase(),
    photo: v.photo !== undefined ? v.photo : (prev.photo || null),
    updated: Date.now(),
  };
  if (!v.id) data.created = Date.now();
  const id = v.id || uid("p");
  const famChoice = $("#f-fam") ? $("#f-fam").value : null;
  $("#saveBtn").disabled = true;
  try {
    await putPerson(id, data);
    S.people.set(id, data); // optimistic, so relation helpers see the new person
    if (!v.id && v.rel) await linkRelation(v.rel, v.of, id, famChoice);
    if ($("#f-me") && $("#f-me").checked) await putSettings({ ...S.settings, rootId: id });
    if (v.id && prev.photo && prev.photo !== data.photo) dropAsset(prev.photo);
    S.view = { mode: "person" }; S.selected = id;
    renderAll(); centerOn(id);
    toast(v.id ? "Dados salvos" : `${fullName(data)} adicionado(a) à árvore`);

    $("#saveBtn").disabled = false;
    formErr(dbMsg(e));

}
async function linkRelation(rel, of, other, famChoice) {
  if (rel === "parent") await addParent(of, other);
  if (rel === "partner") await addPartner(of, other);
  if (rel === "child") await addChild(of, other, famChoice || null);
  if (rel === "sibling") await addSibling(of, other);
}
function dbMsg(e) {
  if (!e) return "Algo deu errado. Tente de novo.";
  if (e instanceof Error) return e.message;
  if (e.code === "quota_exceeded") return "O espaço de armazenamento da árvore está cheio.";
  if (e.code === "invalid_argument") return "Você não tem permissão para editar esta árvore.";
  return "Não consegui salvar agora. Verifique a conexão e tente de novo.";
}

/* ---- photo ---- */
function shrinkImage(file, max) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => b ? resolve({ blob: b, dataUrl: c.toDataURL("image/jpeg", 0.82) }) : reject(new Error("Não consegui ler a imagem.")), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Esse arquivo não parece ser uma imagem.")); };
    img.src = url;
  });
}
async function onPhoto(file) {
  if (!file) return;
  const keep = readForm();
  try {
    if (Store.kind === "db") {
      if (!Store.assets) throw new Error("Fotos indisponíveis aqui.");
      toast("Enviando foto…");
      const { blob } = await shrinkImage(file, 640);
      const res = await Store.assets.upload(blob, { type: "image/jpeg" });
      S.view.photo = res.id;
    } else {
      const { dataUrl } = await shrinkImage(file, 240);
      S.view.photo = dataUrl;
    }
    renderPanel(); writeForm(keep); toast("Foto pronta. Clique em Salvar para guardar.");
  } catch (e) { formErr(e.message || "Não consegui enviar a foto."); }
}

async function uploadFiles(files, { pid, sourceId }) {
  const list = [...files];
  const made = [];
  for (let i = 0; i < list.length; i++) {
    const file = list[i];
    const pdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
    const img = (file.type || "").startsWith("image/");
    if (!pdf && !img) { toast(`“${file.name}” não é imagem nem PDF.`); continue; }
    if (list.length > 1) toast(`Enviando ${i + 1} de ${list.length}…`); else toast("Enviando…");
    let asset, thumb = null, mime;
    if (Store.kind === "db") {
      if (!Store.assets) throw new Error("Envio de arquivos indisponível aqui.");
      if (pdf) {
        if (file.size > 20 * 1024 * 1024) { toast(`“${file.name}” passa de 20 MB.`); continue; }
        asset = (await Store.assets.upload(file, { type: "application/pdf" })).id; mime = "application/pdf";
      } else {
        const big = await shrinkImage(file, 1800), small = await shrinkImage(file, 360);
        asset = (await Store.assets.upload(big.blob, { type: "image/jpeg" })).id;
        thumb = (await Store.assets.upload(small.blob, { type: "image/jpeg" })).id;
        mime = "image/jpeg";
      }
    } else {
      if (pdf) { toast("No modo local não dá para guardar PDF. Use a página publicada."); continue; }
      asset = (await shrinkImage(file, 900)).dataUrl; mime = "image/jpeg";
    }
    const mid = uid("m");
    await putMedia(mid, {
      kind: sourceId || pdf ? "document" : "photo", title: file.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").trim(),
      date: "", place: "", note: "", people: [pid], asset, thumb, mime, sourceId: sourceId || null, created: Date.now(),
    });
    made.push(mid);
  }
  return made;
}
