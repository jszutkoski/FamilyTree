    ${m.note ? `<p class="notes">${esc(m.note)}</p>` : ""}
    ${src ? `<p class="hint">Anexo da fonte <strong>${esc(sourceTitle(src))}</strong></p>` : ""}
    <div class="section"><p class="eyebrow">Pessoas nesta ${m.kind === "document" ? "memória" : "foto"}</p>
      <div class="chips">${people.map((x) => {
        const p = P(x);
        const un = W_ && people.length > 1 ? `<button class="x" type="button" data-act="lb-unlink" data-pid="${x}" title="Tirar esta pessoa" aria-label="Tirar ${esc(fullName(p))}">✕</button>` : "";
        return `<div class="chip"><span class="dot ${sexOf(p)}"></span><button class="who" type="button" data-go="${x}"><strong>${esc(fullName(p))}</strong><span>${esc(lifespan(p) || " ")}</span></button>${un}</div>`;
      }).join("")}</div>
      ${W_ && notIn.length ? `<div class="cite-existing"><label class="sr" for="lbAdd">Ligar outra pessoa</label><select id="lbAdd">${notIn.map((x) => `<option value="${x}">${esc(fullName(P(x)))}</option>`).join("")}</select><button class="btn sm" type="button" data-act="lb-link">Ligar</button></div>` : ""}
    </div>
    <div class="actions">
      ${W_ ? `<button class="btn" type="button" data-act="lb-edit">Editar legenda</button>` : ""}
      ${W_ && sel && !pdf ? `<button class="btn" type="button" data-act="lb-photo">Usar como foto de ${esc(P(sel).given || "perfil")}</button>` : ""}
      ${Store.downloads ? `<button class="btn ghost" type="button" data-act="lb-download">Baixar</button>` : ""}
    </div>
    ${W_ ? (S.lb.confirm ? `<div class="confirm"><p>Excluir esta memória para todas as pessoas ligadas a ela?</p><div class="actions"><button class="btn danger solid" type="button" data-act="lb-del-yes">Excluir</button><button class="btn" type="button" data-act="lb-del-no">Cancelar</button></div></div>`
      : `<div><button class="btn danger ghost sm" type="button" data-act="lb-del">Excluir memória</button></div>`) : ""}
  `;
}
async function lbAction(act, t) {
  const mid = S.lb && S.lb.mid, m = mid && S.media.get(mid);
  if (!m) return;
  switch (act) {
    case "lb-edit": S.lb.editing = true; renderLB(); break;
    case "lb-cancel": S.lb.editing = false; renderLB(); break;
    case "lb-del": S.lb.confirm = true; renderLB(); break;
    case "lb-del-no": S.lb.confirm = false; renderLB(); break;
    case "lb-del-yes": {
      await Store.del("media", mid);
      dropAsset(m.asset, { media: mid }); dropAsset(m.thumb, { media: mid });
      S.lb.list = S.lb.list.filter((x) => x !== mid);
      if (S.lb.list.length) { S.lb.mid = S.lb.list[0]; S.lb.confirm = false; renderLB(); } else closeLB();
      renderPanel(); toast("Memória excluída");
      break;
    }
    case "lb-link": {
      const pid = $("#lbAdd").value;
      await putMedia(mid, { ...m, people: [...new Set([...(m.people || []), pid])] }); toast(`${fullName(P(pid))} ligado(a) a esta memória`);
      break;
    }
    case "lb-unlink": await putMedia(mid, { ...m, people: (m.people || []).filter((x) => x !== t.dataset.pid) }); break;
    case "lb-photo": {
      const pid = S.selected, p = P(pid), old = p.photo;
      const photo = m.thumb || m.asset;
      await putPerson(pid, { ...p, photo, updated: Date.now() });
      if (old && old !== photo) dropAsset(old, { person: pid });
      toast("Foto de perfil atualizada");
      break;
    }
    case "lb-download": {
      try {
        const blob = await (await fetch(assetUrl(m.asset))).blob();
        const ext = isPdfMedia(m) ? "pdf" : "jpg";
        await Store.downloads.save({ filename: `${(m.title || "memoria").replace(/[\\/:*?"<>|]+/g, " ").trim() || "memoria"}.${ext}`, data: blob });
      } catch (e) { if (!e || e.code !== "declined") toast("Não consegui baixar o arquivo."); }
      break;
    }
  }
}

/* ---- new handlers (phase 2) ---- */
document.addEventListener("click", async (e) => {
  const t = e.target.closest("button"); if (!t) return;
  try {
    if (t.dataset.go && t.closest("#lb")) { closeLB(); return; }
    if (t.dataset.ptab) { S.personTab = t.dataset.ptab; renderPanel(); return; }
    if (t.dataset.otab) { S.overviewTab = t.dataset.otab; renderPanel(); return; }
    if (t.dataset.media) {
      const scope = t.closest(".gallery");
      const list = scope ? [...scope.querySelectorAll("[data-media]")].map((b) => b.dataset.media) : [t.dataset.media];
      openLB(t.dataset.media, list); return;
    }
    if (t.dataset.lb === "close") return closeLB();
    if (t.dataset.lb === "prev") return stepLB(-1);
    if (t.dataset.lb === "next") return stepLB(1);
    if (t.dataset.ev) { S.view = { mode: "event", pid: S.selected, evId: t.dataset.ev }; renderPanel(); return; }
    if (t.dataset.src) { S.view = { mode: "source", pid: S.selected, sid: t.dataset.src }; renderPanel(); return; }
    const act = t.dataset.act; if (!act) return;
    if (t.dataset.confirm && !t.dataset.armed) { t.dataset.armed = "1"; t.textContent = "Clique de novo para excluir"; t.classList.add("solid"); return; }
    if (act.startsWith("lb-")) return await lbAction(act, t);
    switch (act) {
      case "ev-new": S.view = { mode: "event", pid: S.selected }; renderPanel(); break;
      case "ev-del": await deleteEvent(); break;
      case "src-new": S.view = { mode: "source", pid: S.selected, sid: uid("s") }; renderPanel(); break;
      case "src-cite": {
        const sid = $("#srcPick").value, s = S.sources.get(sid);
        await putSource(sid, { ...s, people: [...new Set([...(s.people || []), S.selected])] });
        S.view = { mode: "source", pid: S.selected, sid }; renderPanel(); break;
      }
      case "src-uncite": await uncite(t.dataset.sid, S.selected); toast("Fonte retirada desta pessoa"); break;
      case "src-del": { const sid = S.view.sid; await deleteSource(sid); S.view = { mode: "person" }; renderAll(); toast("Fonte excluída"); break; }
    }
  } catch (err) { toast(dbMsg(err)); }
});
document.addEventListener("submit", async (e) => {
  try {
    if (e.target.id === "eventForm") await submitEvent();
    if (e.target.id === "sourceForm") await submitSource();
    if (e.target.id === "mediaForm") {
      const m = S.media.get(S.lb.mid);
      await putMedia(S.lb.mid, { ...m, title: $("#md-title").value.trim(), kind: (document.querySelector("input[name=mdkind]:checked") || {}).value || m.kind, date: $("#md-date").value.trim(), place: $("#md-place").value.trim(), note: $("#md-note").value.trim() });
      S.lb.editing = false; renderLB(); renderPanel(); toast("Memória salva");
    }
  } catch (err) { formErr(dbMsg(err)); }
});
document.addEventListener("change", async (e) => {
  if (e.target.id === "s-type" && !S.sources.has(S.view.sid)) {
    const keys = new Set(defaultFacts(e.target.value, S.view.pid));
    document.querySelectorAll("input[name=sfact]").forEach((c) => { c.checked = keys.has(c.value); });
  }
  if (e.target.id === "mediaFile" || e.target.id === "srcFile") {
    const files = e.target.files; const which = e.target.id;
    if (!files || !files.length) return;
    try {
      if (which === "mediaFile") {
        const made = await uploadFiles(files, { pid: S.selected });
        e.target.value = "";
        if (made.length) { S.personTab = "memorias"; toast(made.length === 1 ? "Memória guardada. Escreva uma legenda." : `${made.length} memórias guardadas`); renderPanel(); if (made.length === 1) { openLB(made[0], mediaOf(S.selected).map(([id]) => id)); S.lb.editing = true; renderLB(); } }
      } else {
        const snap = snapForm("sourceForm");
        const made = await uploadFiles(files, { pid: S.view.pid, sourceId: S.view.sid });
        e.target.value = "";
        renderPanel(); restoreForm("sourceForm", snap);
        if (made.length) toast("Arquivo anexado. Lembre de salvar a fonte.");
      }
    } catch (err) { e.target.value = ""; toast(err && err.message ? err.message : dbMsg(err)); }
  }
});
document.addEventListener("keydown", (e) => {
  if (!S.lb || $("#lb").hidden) return;
  if (e.key === "Escape") { if (S.lb.editing) { S.lb.editing = false; renderLB(); } else closeLB(); }
  if (S.lb.editing || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowLeft") stepLB(-1);
  if (e.key === "ArrowRight") stepLB(1);
});

/* ================= export / import ================= */
function exportData() {
  return {
    app: "raizes-da-familia", version: 2, exportedAt: new Date().toISOString(),
    settings: S.settings,
    people: Object.fromEntries(S.people), families: Object.fromEntries(S.families),
    media: Object.fromEntries(S.media), sources: Object.fromEntries(S.sources),
  };
}
async function offerFile(filename, text, label, okMsg) {
  if (Store.downloads) {
    try { await Store.downloads.save({ filename, data: text }); toast(okMsg || `${label} salvo`); return true; }
    catch (e) { if (e && e.code === "declined") return false; }
  }
  S.view = { mode: "export", filename, text, label }; setSheet(true); renderPanel();
  return false;
}
function renderExportBox(el) {
  const v = S.view;
  el.innerHTML = `
    <h2 style="margin:0;font-family:var(--font-display);font-size:20px">${esc(v.label)}</h2>
    <p class="hint">Não consegui baixar o arquivo direto daqui. Copie o conteúdo abaixo e cole num arquivo chamado <strong>${esc(v.filename)}</strong>.</p>
    <div class="field"><textarea class="code" id="exportText" readonly>${esc(v.text)}</textarea></div>
    <div class="actions"><button class="btn primary" type="button" data-act="copy">Copiar</button><button class="btn" type="button" data-act="cancel">Fechar</button></div>`;
}
function renderRestore(el) {
  const v = S.view;
  el.innerHTML = `
    <h2 style="margin:0;font-family:var(--font-display);font-size:20px">Restaurar cópia</h2>
    <p>O arquivo tem <strong>${v.np}</strong> pessoas, <strong>${v.nf}</strong> uniões, <strong>${v.ns}</strong> fontes e <strong>${v.nm}</strong> memórias. Elas serão juntadas à árvore atual; quem tiver o mesmo código interno será substituído pela versão do arquivo.</p>
    <div class="actions"><button class="btn primary" type="button" data-act="restore-yes">Restaurar</button><button class="btn" type="button" data-act="cancel">Cancelar</button></div>`;
}
async function doRestore() {
  const d = S.view.data;
  toast("Restaurando…");
  try {
    for (const [id, p] of Object.entries(d.people || {})) await putPerson(id, p);
    for (const [id, f] of Object.entries(d.families || {})) await putFamily(id, { partners: f.partners || [], children: f.children || [], marriageDate: f.marriageDate || "", marriagePlace: f.marriagePlace || "" });
    for (const [id, x] of Object.entries(d.sources || {})) await putSource(id, x);
    for (const [id, x] of Object.entries(d.media || {})) await putMedia(id, x);
    if (d.settings && d.settings.rootId && !S.settings.rootId) await putSettings({ ...S.settings, rootId: d.settings.rootId });
    S.view = { mode: "overview" }; S.fittedOnce = false; renderAll(); toast("Cópia restaurada");
  } catch (e) { toast(dbMsg(e)); }
}

/* ---- Excalidraw ---- */
function toExcalidraw() {
  const L = S.layout || computeLayout();
  if (!L) return null;
  const els = [];
  let seed = 1;
  const base = (type, x, y, w, h, extra) => ({
    id: uid("x"), type, x, y, width: w, height: h, angle: 0,
    strokeColor: "#1e1e1e", backgroundColor: "transparent", fillStyle: "solid", strokeWidth: 1, strokeStyle: "solid",
    roughness: 1, opacity: 100, groupIds: [], frameId: null, roundness: null,
    seed: seed++, version: 1, versionNonce: seed * 7919, isDeleted: false, boundElements: null,
    updated: Date.now(), link: null, locked: false, ...extra,
  });
  const fills = { M: "#d0ebff", F: "#ffdeeb", U: "#e9ecef" };
  const line = (pts) => {
    const x0 = pts[0][0], y0 = pts[0][1];
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    els.push(base("line", x0, y0, Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys), {
      points: pts.map(([x, y]) => [x - x0, y - y0]), lastCommittedPoint: null, startBinding: null, endBinding: null,
      startArrowhead: null, endArrowhead: null, strokeColor: "#868e96",
    }));
  };
  for (const u of L.unions) {
    for (const p of u.partners) { const n = L.nodes.get(p); line([[n.x, n.y + H / 2], [n.x, u.y], [u.x, u.y]]); }
    for (const c of u.children) { const n = L.nodes.get(c); const mid = u.y + (n.y - H / 2 - u.y) / 2; line([[u.x, u.y], [u.x, mid], [n.x, mid], [n.x, n.y - H / 2]]); }
    els.push(base("ellipse", u.x - 5, u.y - 5, 10, 10, { backgroundColor: "#868e96", strokeColor: "#868e96" }));
  }
  for (const [id, pos] of L.nodes) {
    const p = P(id);
    const rect = base("rectangle", pos.x - W / 2, pos.y - H / 2, W, H, { backgroundColor: fills[sexOf(p)], roundness: { type: 3 } });
    const txt = [fullName(p), lifespan(p)].filter(Boolean).join("\n");
    const fs = 16, lines = txt.split("\n");
    const tw = Math.min(W - 10, Math.max(...lines.map((l) => l.length)) * fs * 0.55), th = lines.length * fs * 1.25;
    const t = base("text", pos.x - tw / 2, pos.y - th / 2, tw, th, {
      text: txt, originalText: txt, fontSize: fs, fontFamily: 1, textAlign: "center", verticalAlign: "middle",
      containerId: rect.id, lineHeight: 1.25, autoResize: true, baseline: fs,
    });
    rect.boundElements = [{ id: t.id, type: "text" }];
    els.push(rect, t);
  }
  return { elements: els };
}
function excalidrawFile() {
  const x = toExcalidraw();
  if (!x) return null;
  return JSON.stringify({ type: "excalidraw", version: 2, source: "https://excalidraw.com", elements: x.elements, appState: { viewBackgroundColor: "#ffffff", gridSize: null }, files: {} });
}
async function exportExcalidraw() {
  const json = excalidrawFile();
  if (!json) return toast("Adicione pessoas antes de exportar.");
  await offerFile("arvore-familia.excalidraw.json", json, "Desenho para o Excalidraw", "Arquivo salvo. No excalidraw.com, use Menu › Abrir e escolha esse arquivo.");
}
async function copyExcalidraw() {
  const json = excalidrawFile();
  if (!json) return toast("Adicione pessoas antes de exportar.");
  try { await navigator.clipboard.writeText(json); toast("Copiado. Abra excalidraw.com e aperte Ctrl+V (ou Colar)."); }
  catch (e) { S.view = { mode: "export", filename: "arvore-familia.excalidraw.json", text: json, label: "Desenho para o Excalidraw" }; setSheet(true); renderPanel(); }
}

/* ================= search ================= */
const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
let resIdx = 0;
function runSearch() {
  const q = norm($("#q").value.trim()), box = $("#results");
  if (!q) { box.hidden = true; return; }
  const hits = [...S.people.entries()].filter(([, p]) => norm(fullName(p) + " " + (p.birthPlace || "") + " " + (p.deathPlace || "")).includes(q)).slice(0, 12);
  resIdx = 0;
  box.innerHTML = hits.length ? hits.map(([id, p], i) => `<button type="button" data-go="${id}" class="${i === 0 ? "active" : ""}"><span>${esc(fullName(p))}</span><span class="yrs">${esc(lifespan(p))}</span></button>`).join("") : `<div class="none">Ninguém encontrado com “${esc($("#q").value.trim())}”.</div>`;
  box.hidden = false;
}
$("#q").addEventListener("input", runSearch);
$("#q").addEventListener("keydown", (e) => {
  const btns = [...$("#results").querySelectorAll("button")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!btns.length) return; resIdx = (resIdx + (e.key === "ArrowDown" ? 1 : -1) + btns.length) % btns.length; btns.forEach((b, i) => b.classList.toggle("active", i === resIdx)); }
  if (e.key === "Enter" && btns[resIdx]) { e.preventDefault(); btns[resIdx].click(); }
  if (e.key === "Escape") { $("#results").hidden = true; $("#q").blur(); }
});
document.addEventListener("click", (e) => { if (!e.target.closest(".search")) $("#results").hidden = true; if (!e.target.closest(".menu-wrap")) closeMenu(); });

/* ================= menu ================= */
function closeMenu() { $("#menu").hidden = true; $("#menuBtn").setAttribute("aria-expanded", "false"); }
$("#menuBtn").addEventListener("click", () => { const m = $("#menu"); m.hidden = !m.hidden; $("#menuBtn").setAttribute("aria-expanded", String(!m.hidden)); });
$("#menu").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return; closeMenu();
  if (b.dataset.act === "excalidraw") exportExcalidraw();
  if (b.dataset.act === "excalidraw-copy") copyExcalidraw();
  if (b.dataset.act === "backup") offerFile(`arvore-familia-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(exportData(), null, 2), "Cópia de segurança");
  if (b.dataset.act === "restore") $("#restoreFile").click();
});
$("#restoreFile").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || typeof d.people !== "object") throw new Error();
    S.view = { mode: "restore", data: d, np: Object.keys(d.people).length, nf: Object.keys(d.families || {}).length, ns: Object.keys(d.sources || {}).length, nm: Object.keys(d.media || {}).length };
    setSheet(true); renderPanel();
  } catch (err) { toast("Esse arquivo não é uma cópia de segurança desta árvore."); }
});

/* ================= panel events ================= */
$("#addBtn").addEventListener("click", () => { S.view = { mode: "edit" }; setSheet(true); renderPanel(); });
$("#startBtn").addEventListener("click", () => { S.view = { mode: "edit" }; setSheet(true); renderPanel(); });

document.addEventListener("click", async (e) => {
  const go = e.target.closest("[data-go]");
  if (go) { $("#results").hidden = true; $("#q").value = ""; select(go.dataset.go, { center: true }); return; }
  const inPanel = e.target.closest("#panel"); if (!inPanel) return;
  const t = e.target.closest("button"); if (!t) return;
  const id = S.selected;
  try {
    if (t.dataset.add) { S.view = { mode: "edit", rel: t.dataset.add, of: id, tab: "new" }; renderPanel(); return; }
    if (t.dataset.tab) { S.view.tab = t.dataset.tab; renderPanel(); return; }
    if (t.dataset.fam) { S.view = { mode: "family", fid: t.dataset.fam }; renderPanel(); return; }
    if (t.dataset.unlink) {
      const o = t.dataset.other, k = t.dataset.unlink;
      if (k === "parent") await unlinkParent(id, o);
      if (k === "child") await unlinkChild(id, o);
      if (k === "partner") await unlinkPartner(id, o);
      if (k === "sibling") await unlinkSibling(id, o);
      toast("Ligação removida");
      return;
    }
    switch (t.dataset.act) {
      case "edit": S.view = { mode: "edit", id }; renderPanel(); break;
      case "me": await putSettings({ ...S.settings, rootId: id }); toast("Pronto. Agora cada pessoa mostra o parentesco com você."); break;
      case "del": S.view = { mode: "person", confirmDelete: true }; renderPanel(); break;
      case "del-no": S.view = { mode: "person" }; renderPanel(); break;
      case "del-yes": { const name = fullName(P(id)); await deletePerson(id); select(null); toast(`${name} foi excluído(a)`); break; }
      case "cancel": S.view = S.selected ? { mode: "person" } : { mode: "overview" }; if (!S.selected) setSheet(false); renderPanel(); break;
      case "nophoto": { const keep = readForm(); S.view.photo = null; renderPanel(); writeForm(keep); break; }
      case "copy": {
        const ta = $("#exportText");
        try { await navigator.clipboard.writeText(ta.value); toast("Copiado"); } catch (err) { ta.focus(); ta.select(); toast("Selecionei o texto. Use Ctrl+C para copiar."); }
        break;
      }
      case "restore-yes": await doRestore(); break;
    }
  } catch (err) { toast(dbMsg(err)); }
});
document.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (e.target.id === "personForm") return submitPerson();
  if (e.target.id === "linkForm") {
    const v = S.view, other = $("#f-existing").value, fam = $("#f-fam") ? $("#f-fam").value : null;
    try { await linkRelation(v.rel, v.of, other, fam); S.view = { mode: "person" }; renderAll(); toast("Ligação criada"); }
    catch (err) { formErr(dbMsg(err)); }
  }
  if (e.target.id === "famForm") {
    const f = S.families.get(S.view.fid);
    try { await putFamily(S.view.fid, { ...f, marriageDate: $("#m-date").value.trim(), marriagePlace: $("#m-place").value.trim() }); S.view = { mode: "person" }; renderAll(); toast("União salva"); }
    catch (err) { formErr(dbMsg(err)); }
  }
});
document.addEventListener("change", (e) => { if (e.target.id === "f-photo") onPhoto(e.target.files[0]); });

/* ================= misc ================= */
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3200); }
let noticeTimer;
function showNotice(msg, ms) { const n = $("#notice"); n.textContent = msg; n.hidden = false; clearTimeout(noticeTimer); if (ms) noticeTimer = setTimeout(() => (n.hidden = true), ms); else noticeTimer = setTimeout(() => (n.hidden = true), 9000); }

function renderAll() {
  $("#loading").hidden = S.loaded;
  const has = S.people.size > 0;
  $("#empty").hidden = !S.loaded || has;
  $("#zoomCtl").hidden = !has; $("#legend").hidden = !has;
  $("#count").textContent = has ? `${S.people.size} ${S.people.size === 1 ? "pessoa" : "pessoas"}` : "";
  document.querySelectorAll(".edit-only").forEach((b) => (b.hidden = !S.canWrite));
  if (S.selected && !S.people.has(S.selected)) { S.selected = null; S.view = { mode: "overview" }; }
  if (typeof dagre === "undefined" && has) showNotice("Não consegui carregar o desenho da árvore. Recarregue a página.", 0);
  renderTree();
  if (!["edit", "family", "event", "source", "restore", "export"].includes(S.view.mode)) renderPanel();
  if (S.lb && !S.lb.editing) renderLB();
}

renderPanel();
boot();
})();
</script>
